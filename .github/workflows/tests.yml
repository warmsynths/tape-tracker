name: Four-Track tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the host tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          sh tests/run.sh
